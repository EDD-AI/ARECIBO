# ORBITE → itch.io : fabrique le ZIP du jeu (orbite/tools/itch-zip.sh) et l'envoie sur
# https://edda-studio.itch.io/orbite-game avec butler, l'outil officiel d'itch.io.
# - À la main : onglet Actions → « itch.io (ORBITE) » → Run workflow.
# - Tout seul : à chaque nouvelle version du jeu sur main (orbite/version.json change).
# La clé vient du secret BUTLER_API_KEY du dépôt (itch.io → Settings → API keys), jamais du code.
name: itch.io (ORBITE)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['orbite/version.json']

concurrency:
  group: itch-orbite
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  envoi:
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Clé itch.io présente ?
        id: cle
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "::warning::Le secret BUTLER_API_KEY manque : rien n'est envoyé (Settings → Secrets and variables → Actions)."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Paquet du jeu
        if: steps.cle.outputs.ok == '1'
        run: bash orbite/tools/itch-zip.sh "$RUNNER_TEMP/orbite-itch.zip"

      - name: butler
        if: steps.cle.outputs.ok == '1'
        run: |
          # itch.io sert butler depuis broth.itch.zone (l'ancienne adresse broth.itch.ovh, en secours).
          ok=0
          for h in broth.itch.zone broth.itch.ovh; do
            if curl -fsSL --retry 3 -o "$RUNNER_TEMP/butler.zip" "https://$h/butler/linux-amd64/LATEST/archive/default"; then ok=1; break; fi
            echo "::warning::butler introuvable sur $h"
          done
          [ "$ok" = 1 ] || { echo "::error::Impossible de télécharger butler."; exit 1; }
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          "$RUNNER_TEMP/butler/butler" -V

      # La cible exacte (nom d'utilisateur itch.io / adresse de la page) est demandée à itch.io avec la clé :
      # le nom du compte peut s'écrire autrement que son adresse (edda_studio pour edda-studio.itch.io).
      - name: Trouver la page ORBITE
        id: cible
        if: steps.cle.outputs.ok == '1'
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          k = os.environ['BUTLER_API_KEY']
          def get(path):
              with urllib.request.urlopen('https://itch.io/api/1/%s/%s' % (k, path), timeout=30) as r:
                  return json.load(r)
          me = get('me').get('user', {})
          games = get('my-games').get('games', [])
          print('compte itch.io :', me.get('username'), me.get('url'))
          for g in games:
              print('page :', g.get('title'), '|', g.get('url'), '|', 'publiée' if g.get('published') else 'brouillon')
          # La page d'ORBITE : son adresse finit par /orbite ou /orbite-game, sinon son titre commence par ORBITE.
          slug_of = lambda g: (g.get('url') or '').rstrip('/').split('/')[-1]
          pick = [g for g in games if slug_of(g) in ('orbite', 'orbite-game')] or [g for g in games if (g.get('title') or '').strip().upper().startswith('ORBITE')]
          if not pick:
              print('::error::Aucune page ORBITE sur ce compte itch.io : créez-la (Dashboard → Create new project, Kind of project HTML), puis enregistrez.')
              raise SystemExit(1)
          slug = pick[0]['url'].rstrip('/').split('/')[-1]
          target = '%s/%s:html5' % (me['username'], slug)
          print('cible :', target)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('cible=%s\n' % target)
          PY

      - name: Envoi sur itch.io
        if: steps.cle.outputs.ok == '1'
        env:
          CIBLE: ${{ steps.cible.outputs.cible }}
        run: |
          V="$(sed -n 's/.*"v": *\([0-9]*\).*/\1/p' orbite/version.json)"
          "$RUNNER_TEMP/butler/butler" push "$RUNNER_TEMP/orbite-itch.zip" "$CIBLE" --userversion "$V"
          "$RUNNER_TEMP/butler/butler" status "$CIBLE"
